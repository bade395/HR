        const EXPORT_A4 = Object.freeze({ widthPx: 794, heightPx: 1123, widthMm: 210, heightMm: 297 });

        function waitForImage(image) {
            if (!image || image.complete) return Promise.resolve(image);
            return new Promise(resolve => {
                image.addEventListener('load', () => resolve(image), { once: true });
                image.addEventListener('error', () => resolve(image), { once: true });
            });
        }

        async function resourceToDataUrl(url) {
            if (!url || url.startsWith('data:') || url.startsWith('blob:')) return url;
            try {
                const response = await fetch(url, { credentials: 'same-origin', cache: 'force-cache' });
                if (!response.ok) throw new Error(`Resource request failed: ${response.status}`);
                const blob = await response.blob();
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(blob);
                });
            } catch (error) {
                console.warn('Export resource could not be embedded:', url, error);
                return url;
            }
        }

        async function waitForExportResources(root) {
            if (document.fonts && document.fonts.ready) await document.fonts.ready;
            const images = Array.from(root.querySelectorAll('img'));
            await Promise.all(images.map(async image => {
                await waitForImage(image);
                const embedded = await resourceToDataUrl(image.currentSrc || image.src);
                if (embedded && embedded !== image.src) image.src = embedded;
            }));
            const nodes = [root, ...root.querySelectorAll('*')];
            await Promise.all(nodes.map(async node => {
                const image = getComputedStyle(node).backgroundImage;
                const match = image && image.match(/url\(["']?([^"')]+)["']?\)/);
                if (!match || !match[1] || match[1].startsWith('data:')) return;
                const embedded = await resourceToDataUrl(match[1]);
                if (embedded && embedded !== match[1]) node.style.backgroundImage = `url("${embedded}")`;
            }));
        }

        async function exportElementToPdf(elementId, filename) {
            const element = document.getElementById(elementId);
            if (!element) {
                alert('لم يتم العثور على محتوى الوثيقة.');
                return;
            }
            if (!window.html2canvas || !window.jspdf) {
                alert('تعذر تحميل محرك تصدير PDF. تحقق من الاتصال بالإنترنت ثم أعد المحاولة.');
                return;
            }

            const clone = element.cloneNode(true);
            // cloneNode copies markup but not live React-controlled input values; sync them before Canvas capture.
            const sourceControls = Array.from(element.querySelectorAll('input, textarea, select'));
            const clonedControls = Array.from(clone.querySelectorAll('input, textarea, select'));
            sourceControls.forEach((source, index) => {
                const target = clonedControls[index];
                if (!target) return;
                if (source instanceof HTMLInputElement) {
                    if (source.type === 'checkbox' || source.type === 'radio') target.checked = source.checked;
                    else target.value = source.value;
                } else if (source instanceof HTMLTextAreaElement) {
                    target.value = source.value;
                    target.textContent = source.value;
                } else if (source instanceof HTMLSelectElement) {
                    target.value = source.value;
                    Array.from(target.options).forEach(option => { option.selected = option.value === source.value; });
                }
            });
            const stage = document.createElement('div');
            stage.id = 'fixed-a4-export-stage';
            stage.style.cssText = [
                'position:fixed', 'left:-100000px', 'top:0', 'z-index:-1',
                `width:${EXPORT_A4.widthPx}px`, `min-width:${EXPORT_A4.widthPx}px`, `max-width:${EXPORT_A4.widthPx}px`,
                `height:${EXPORT_A4.heightPx}px`, `min-height:${EXPORT_A4.heightPx}px`, `max-height:${EXPORT_A4.heightPx}px`,
                'overflow:hidden', 'background:#fff', 'direction:rtl', 'unicode-bidi:plaintext',
                'contain:strict', 'isolation:isolate'
            ].join(';');

            clone.classList.add('a4-print-stage');
            Object.assign(clone.style, {
                width: `${EXPORT_A4.widthPx}px`, minWidth: `${EXPORT_A4.widthPx}px`, maxWidth: `${EXPORT_A4.widthPx}px`,
                height: `${EXPORT_A4.heightPx}px`, minHeight: `${EXPORT_A4.heightPx}px`, maxHeight: `${EXPORT_A4.heightPx}px`,
                margin: '0', boxShadow: 'none', direction: 'rtl', unicodeBidi: 'plaintext',
                backgroundColor: '#f4f0e8', backgroundImage: `url(${ALNESR_INFO.letterheadBg})`,
                backgroundSize: '100% 100%', backgroundRepeat: 'no-repeat', backgroundPosition: 'center',
                WebkitPrintColorAdjust: 'exact', printColorAdjust: 'exact'
            });

            clone.querySelectorAll('.no-print').forEach(el => el.remove());
            const exportControls = Array.from(clone.querySelectorAll('input, textarea, select'));
            exportControls.forEach((control, index) => {
                const source = sourceControls[index];
                if (!source) return;
                const computed = getComputedStyle(source);
                const text = source instanceof HTMLSelectElement
                    ? (source.options[source.selectedIndex]?.text || source.value || '')
                    : source instanceof HTMLInputElement && (source.type === 'checkbox' || source.type === 'radio')
                        ? (source.checked ? '✓' : '□')
                        : source.value || '';
                const replacement = document.createElement('span');
                replacement.textContent = text;
                replacement.className = 'pdf-field-value';
                Object.assign(replacement.style, {
                    display: 'inline-flex', alignItems: 'center', justifyContent: computed.textAlign === 'center' ? 'center' : computed.textAlign === 'left' ? 'flex-end' : 'flex-start', width: '100%', minHeight: `${Math.max(20, source.getBoundingClientRect().height)}px`,
                    padding: computed.padding, margin: computed.margin, color: computed.color, font: computed.font,
                    fontSize: computed.fontSize, fontWeight: computed.fontWeight, lineHeight: computed.lineHeight,
                    textAlign: computed.textAlign, direction: 'rtl', unicodeBidi: 'plaintext', whiteSpace: source instanceof HTMLTextAreaElement ? 'pre-wrap' : 'normal',
                    overflow: 'visible', wordBreak: 'break-word', background: 'transparent', border: 'none', boxShadow: 'none'
                });
                control.replaceWith(replacement);
            });
            clone.querySelectorAll('[dir]').forEach(el => el.setAttribute('dir', 'rtl'));
            stage.appendChild(clone);
            document.body.appendChild(stage);

            try {
                await waitForExportResources(clone);
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                const canvas = await html2canvas(clone, {
                    scale: Math.max(2, Math.min(3, window.devicePixelRatio || 2)),
                    useCORS: true, allowTaint: false, backgroundColor: '#f4f0e8', imageTimeout: 30000,
                    logging: false, width: EXPORT_A4.widthPx, height: EXPORT_A4.heightPx,
                    windowWidth: EXPORT_A4.widthPx, windowHeight: EXPORT_A4.heightPx, scrollX: 0, scrollY: 0,
                    onclone: clonedDocument => {
                        const exportRoot = clonedDocument.getElementById(elementId);
                        if (exportRoot) {
                            exportRoot.style.backgroundImage = `url(${ALNESR_INFO.letterheadBg})`;
                            exportRoot.style.backgroundSize = '100% 100%';
                            exportRoot.style.direction = 'rtl';
                            exportRoot.style.unicodeBidi = 'plaintext';
                        }
                    }
                });

                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ unit: 'mm', format: [EXPORT_A4.widthMm, EXPORT_A4.heightMm], orientation: 'portrait', compress: true, putOnlyUsedFonts: true });
                pdf.addImage(canvas.toDataURL('image/jpeg', 0.98), 'JPEG', 0, 0, EXPORT_A4.widthMm, EXPORT_A4.heightMm, undefined, 'FAST');
                pdf.save(filename || 'وثيقة_النسر_الثاقب.pdf');
            } catch (err) {
                console.error('A4 PDF export failed:', err);
                alert('تعذر إنشاء ملف PDF. حاول مرة أخرى.');
            } finally {
                stage.remove();
            }
        }

        async function printA4Document(elementId) {
            const element = document.getElementById(elementId);
            if (!element) {
                alert('لم يتم العثور على محتوى الوثيقة.');
                return;
            }
            document.querySelectorAll('.print-target-document').forEach(el => el.classList.remove('print-target-document'));
            element.classList.add('print-target-document');
            document.body.classList.add('printing');
            const cleanup = () => {
                document.body.classList.remove('printing');
                element.classList.remove('print-target-document');
                window.removeEventListener('afterprint', cleanup);
            };
            window.addEventListener('afterprint', cleanup);
            try {
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                await waitForExportResources(element);
                await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
                window.print();
            } catch (error) {
                console.error('A4 print preparation failed:', error);
                cleanup();
                alert('تعذر تجهيز المستند للطباعة. حاول مرة أخرى.');
            }
        }

                let nitaqatBand = 'أحمر';
                let bandColor = 'bg-rose-600 text-white';
                if (saudizationRate >= 40) {
                    nitaqatBand = 'بلاتيني (Platinum)';
                    bandColor = 'bg-slate-900 text-emerald-400 border border-emerald-500';
                } else if (saudizationRate >= 27) {
                    nitaqatBand = 'أخضر مرتفع (High Green)';
                    bandColor = 'bg-emerald-600 text-white';
                } else if (saudizationRate >= 15) {
                    nitaqatBand = 'أخضر متوسط (Mid Green)';
                    bandColor = 'bg-emerald-500 text-white';
                } else if (saudizationRate >= 10) {
                    nitaqatBand = 'أخضر منخفض (Low Green)';
                    bandColor = 'bg-yellow-500 text-slate-900';
                }

                const today = new Date();
                const sixtyDays = new Date();
                sixtyDays.setDate(today.getDate() + 60);

                const expiringDocs = employees.filter(e => {
                    if (e.iqama_expiry_date && new Date(e.iqama_expiry_date) <= sixtyDays) return true;
                    if (e.contract_end_date && new Date(e.contract_end_date) <= sixtyDays) return true;
                    return false;
                });

                const totalDeductions = disciplinaryList.reduce((sum, d) => sum + Number(d.deduction_amount || 0), 0);
                const totalSettlementsPaid = settlementsList.reduce((sum, s) => sum + Number(s.net_settlement || 0), 0);

                return {
                    total,
                    saudiCount,
                    nonSaudiCount,
                    saudizationRate,
                    totalGrossSalaries: totalGross,
                    totalGosi,
                    totalNetSalaries: totalNet,
                    nitaqatBand,
                    bandColor,
                    expiringCount: expiringDocs.length,
                    expiringDocs,
                    totalDeductions,
                    totalSettlementsPaid,
                    disciplinaryCount: disciplinaryList.length,
                    settlementsCount: settlementsList.length
                };
            }, [employees, disciplinaryList, settlementsList]);

            const filteredEmployees = useMemo(() => {

                        emp.national_id?.toLowerCase().includes(searchTerm.toLowerCase()) ||
                        emp.job_title?.toLowerCase().includes(searchTerm.toLowerCase()) ||

                    const matchesNat = filterNationality === 'الكل' || (filterNationality === 'سعودي' ? emp.nationality === 'سعودي' : emp.nationality !== 'سعودي');
                    const matchesContract = filterContract === 'الكل' || emp.contract_type === filterContract;

                    return matchesSearch && matchesDept && matchesNat && matchesContract;

                let gosi = 0;
                if (empData.nationality === 'سعودي') {
                    gosi = Math.min(basic + housing, 45000) * 0.0975;
                }
                const net = gross - gosi;

                const processed = {
                    ...empData,
                    basic_salary: basic,
                    housing_allowance: housing,
                    transport_allowance: transport,
                    other_allowances: other,
                    gosi_employee_deduction: gosi,
                    net_salary: net

                if (selectedEmployee) {
                    setEmployees(prev => prev.map(e => e.id === selectedEmployee.id ? { ...processed, id: e.id } : e));

        async function renderNativeRecordCanvas({ kind, item, employee }) {
            if (!window.html2canvas) throw new Error('Canvas engine unavailable');
            const person = employee || item || {};
            const base = `class="alnesr-a4-sheet font-formal text-slate-900" dir="rtl" style="position:fixed;left:-10000px;top:0;width:794px;height:1123px;background:#fff;overflow:hidden"`;
            const heading = (title, refLabel, refCode, date) => `<div class="native-record-header"><div style="text-align:center;color:#1e3a8a;font-size:28px;font-weight:800">النسر الثاقب</div><div style="text-align:center;color:#1e3a8a;font-size:18px;font-weight:700;margin-top:8px">شركة النسر الثاقب</div><div class="native-record-meta"><span>${escapeRecordHtml(refLabel)}: ${escapeRecordHtml(refCode)}</span><span>التاريخ: ${escapeRecordHtml(date)}</span></div><div class="native-record-title">${escapeRecordHtml(title)}</div></div>`;
            const employeeRows = `<div class="form-sec-head"><span>■</span><span>بيانات الموظف</span></div><table class="form-table"><tbody><tr><td class="label-cell">اسم الموظف</td><td class="value-cell font-bold">${escapeRecordHtml(item.employee_name || person.full_name)}</td><td class="label-cell">الرقم الوظيفي</td><td class="value-cell font-mono font-bold">${escapeRecordHtml(item.emp_code || person.emp_code)}</td></tr><tr><td class="label-cell">المسمى الوظيفي</td><td class="value-cell">${escapeRecordHtml(item.job_title || person.job_title)}</td><td class="label-cell">الإدارة / القسم</td><td class="value-cell">${escapeRecordHtml(item.department || person.department)}</td></tr></tbody></table>`;
            let content = '';
            if (kind === 'discipline') content = heading('إشعار قرار جزاء إداري', 'رقم القرار الإداري', `DISC-${item.emp_code}-${String(item.violation_date || '').replace(/\\//g, '')}`, item.violation_date) + employeeRows + `<div class="form-sec-head"><span>■</span><span>بيانات المخالفة والجزاء الموقع</span></div><table class="form-table"><tbody><tr><td class="label-cell">تاريخ المخالفة</td><td class="value-cell">${escapeRecordHtml(item.violation_date)}</td><td class="label-cell">درجة المخالفة</td><td class="value-cell font-bold">${escapeRecordHtml(item.violation_degree)}</td></tr><tr><td class="label-cell">نوع المخالفة والوقائع</td><td colspan="3" class="value-cell font-bold">${escapeRecordHtml(item.violation_type)}</td></tr><tr><td class="label-cell">الحيثيات والتفاصيل</td><td colspan="3" class="value-cell leading-relaxed">${escapeRecordHtml(item.details)}</td></tr><tr><td class="label-cell">الجزاء الإداري المقرر</td><td class="value-cell font-black text-[#1e3a8a]">${escapeRecordHtml(item.action_taken)}</td><td class="label-cell">مبلغ الخصم</td><td class="value-cell font-black text-rose-800">${Number(item.deduction_amount || 0).toLocaleString('ar-SA')} ر.س</td></tr></tbody></table>`;
            if (kind === 'clearance') content = heading('سند مخالصة نهائية وإبراء ذمة شامل', 'رقم المخالصة', `CLR-${item.emp_code}-${String(item.termination_date || '').replace(/\\//g, '')}`, item.termination_date) + employeeRows + `<div class="form-sec-head"><span>■</span><span>بيان المخالصة النهائية</span></div><table class="form-table"><tbody><tr><td class="label-cell">تاريخ انتهاء العمل</td><td class="value-cell">${escapeRecordHtml(item.termination_date)}</td><td class="label-cell">سبب انتهاء العقد</td><td class="value-cell">${escapeRecordHtml(item.reason)}</td></tr><tr><td class="label-cell font-black text-[#1e3a8a]">صافي المبلغ المستلم</td><td colspan="3" class="value-cell font-black text-base text-[#1e3a8a]">${Number(item.net_settlement || 0).toLocaleString('ar-SA')} ريال سعودي فقط لا غير</td></tr></tbody></table><div class="form-sec-head"><span>■</span><span>صيغة الإقرار والتنازل وإبراء الذمة الشامل</span></div><div class="p-3 bg-[#deebf9] border border-slate-400 text-xs leading-relaxed">أقر أنا الموظف الموضح اسمي وبياناتي أعلاه بأنني استلمت كامل مستحقاتي المالية والنظامية عن فترة عملي، وبناءً عليه أبرئ ذمة المنشأة إبراءً شاملاً.</div>`;

            if (kind === 'experience') content = heading('شهادة خبرة معتمدة', 'رقم الشهادة', `EXP-${item.emp_code}-${String(item.termination_date || '').replace(/\\//g, '')}`, item.termination_date) + employeeRows + `<div class="form-sec-head"><span>■</span><span>نص الشهادة</span></div><div class="p-5 bg-[#deebf9] border border-slate-400 text-sm leading-loose text-justify">تشهد شركة النسر الثاقب بأن الموظف المذكور أعلاه قد عمل لديها خلال الفترة النظامية، وأنه أنهى علاقته التعاقدية بتاريخ ${escapeRecordHtml(item.termination_date)}، وقد أُصدرت هذه الشهادة بناءً على طلبه.</div>`;
            const sheet = document.createElement('div'); sheet.setAttribute('dir', 'rtl'); sheet.innerHTML = `<div ${base}>${content}<div class="native-record-footer">نظام الموارد البشرية المتكامل • شركة النسر الثاقب</div></div>`; document.body.appendChild(sheet);
            await document.fonts?.ready;
            const canvas = await window.html2canvas(sheet.firstElementChild, { scale: 2, useCORS: true, backgroundColor: '#fff', width: 794, height: 1123, logging: false });
            sheet.remove(); return canvas;
        }

        async function renderArabicSheetCanvas({ title, employee, fileName, uploadedAt, notes, imageData, footerText }) {
            if (!window.html2canvas) throw new Error('Canvas engine unavailable');
            const sheet = document.createElement('div');
            sheet.dir = 'rtl';
            sheet.style.cssText = 'position:fixed;left:-10000px;top:0;width:794px;height:1123px;background:#fff;color:#1f2937;font-family:Cairo,Tajawal,Arial,sans-serif;padding:70px 58px;box-sizing:border-box;direction:rtl;';
            sheet.innerHTML = `<div style="text-align:center;color:#1e3a8a;font-size:30px;font-weight:800;line-height:1.3">النسر الثاقب</div><div style="text-align:center;color:#1e3a8a;font-size:20px;font-weight:700;margin-top:22px">${title || 'مستند موظف'}</div><div style="border-bottom:2px solid #94a3b8;margin:28px 0 26px"></div><div style="font-size:16px;line-height:2.2;text-align:right"><div><b>الموظف:</b> ${employee?.full_name || ''}</div><div><b>الرقم الوظيفي:</b> ${employee?.emp_code || ''}</div><div><b>اسم الملف:</b> ${fileName || 'مستند'}</div><div><b>تاريخ الرفع:</b> ${uploadedAt || ''}</div>${notes ? `<div><b>ملاحظات:</b> ${notes}</div>` : ''}</div>${imageData ? `<img src="${imageData}" style="display:block;max-width:100%;max-height:640px;margin:30px auto 0;object-fit:contain;border:1px solid #cbd5e1" />` : `<div style="margin-top:34px;padding:24px;border:1px solid #cbd5e1;border-radius:14px;text-align:center;font-size:17px;color:#475569">${footerText || 'المرفق الأصلي محفوظ داخل نفس حزمة ZIP بصيغته الأصلية.'}</div>`}<div style="position:absolute;bottom:48px;right:58px;left:58px;border-top:1px solid #cbd5e1;padding-top:12px;font-size:12px;color:#64748b;text-align:center">نظام الموارد البشرية المتكامل • شركة النسر الثاقب</div>`;
            document.body.appendChild(sheet);
            await document.fonts?.ready;
            const canvas = await window.html2canvas(sheet, { scale: 2, useCORS: true, backgroundColor: '#ffffff', width: 794, height: 1123, logging: false });
            sheet.remove();
            return canvas;
        }

        async function renderArabicSheetToPdfBlob(options) {
            if (!window.jspdf) throw new Error('PDF engine unavailable');
            const canvas = await renderArabicSheetCanvas(options);
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
            pdf.addImage(canvas.toDataURL('image/jpeg', 0.96), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
            return pdf.output('blob');
        }

        async function createEmployeeDocumentPdfBlob(doc, employee) {
            return renderArabicSheetToPdfBlob({ title: doc?.document_type || 'مستند موظف', employee, fileName: doc?.file_name, uploadedAt: doc?.uploaded_at, notes: doc?.notes, imageData: doc?.file_type?.startsWith('image/') ? doc.file_data : '', footerText: doc?.file_type === 'application/pdf' ? 'المرفق الأصلي بصيغة PDF محفوظ داخل نفس حزمة ZIP.' : undefined });
        }

        function EmployeeDocumentsView({ employees, documents, onAddDocument, onDeleteDocument, disciplinaryList, settlementsList }) {
            const [selectedEmpId, setSelectedEmpId] = useState(employees[0]?.id || '');

            const [previewPdfUrl, setPreviewPdfUrl] = useState('');
            const employee = employees.find(e => e.id === selectedEmpId) || employees[0] || {};
            const employeeDocs = documents.filter(doc => doc.employee_id === employee.id);
            const employeeDiscipline = disciplinaryList.filter(item => item.employee_id === employee.id);
            const employeeSettlements = settlementsList.filter(item => item.employee_id === employee.id);
            const handleFile = (event) => {
                const file = event.target.files?.[0];

                const reader = new FileReader();
                reader.onload = () => {
                    onAddDocument({ id: `doc-${Date.now()}`, employee_id: employee.id, employee_name: employee.full_name, emp_code: employee.emp_code, document_type: documentType, file_name: file.name, file_type: file.type, file_data: reader.result, notes, uploaded_at: new Date().toISOString().slice(0,10).replace(/-/g,'/') });
                    setNotes(''); event.target.value = '';
                };
                reader.readAsDataURL(file);
            };
            const downloadText = (filename, content) => {
                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement('a'); anchor.href = url; anchor.download = filename; anchor.click();
                setTimeout(() => URL.revokeObjectURL(url), 500);
            };
            const handlePreviewAll = async () => {
                if (!window.jspdf || !window.html2canvas) return;
                const { jsPDF } = window.jspdf;
                const pdf = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
                const pages = [];
                employeeDocs.forEach(doc => pages.push({ kind: 'document', item: doc }));
                employeeDiscipline.forEach(item => pages.push({ kind: 'discipline', item }));
                employeeSettlements.forEach(item => { pages.push({ kind: 'clearance', item }); pages.push({ kind: 'settlement', item }); pages.push({ kind: 'experience', item }); });
                if (!pages.length) pages.push({ kind: 'settlement', item: { ...employee, employee_name: employee.full_name, emp_code: employee.emp_code, net_settlement: 0, termination_date: '', reason: 'لا توجد تسوية مسجلة' } });
                for (let index = 0; index < pages.length; index += 1) {
                    const page = pages[index];
                    const canvas = page.kind === 'document' ? await renderArabicSheetCanvas({ title: page.item.document_type, employee, fileName: page.item.file_name, uploadedAt: page.item.uploaded_at, notes: page.item.notes, imageData: page.item.file_type?.startsWith('image/') ? page.item.file_data : '', footerText: page.item.file_type === 'application/pdf' ? 'المرفق الأصلي بصيغة PDF محفوظ داخل نفس حزمة ZIP.' : undefined }) : await renderNativeRecordCanvas({ kind: page.kind, item: page.item, employee });
                    if (index > 0) pdf.addPage();

            const handleDownloadAll = async () => {

                zip.file('السجلات/الجزاءات_والخصومات.txt', disciplineText);
                zip.file('السجلات/التسويات_والمستحقات.txt', settlementsText);
                for (let index = 0; index < employeeDiscipline.length; index += 1) {
                    const record = employeeDiscipline[index];
                    const canvas = await renderNativeRecordCanvas({ kind: 'discipline', item: record, employee });
                    const pdf = new window.jspdf.jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait', compress: true });
                    pdf.addImage(canvas.toDataURL('image/jpeg', 0.96), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                    zip.file(`PDF/الجزاءات_والخصومات/${index + 1}_${record.emp_code}.pdf`, pdf.output('blob'));
                }
                for (let index = 0; index < employeeSettlements.length; index += 1) {
                    const record = employeeSettlements[index];

                        pdf.addImage(canvas.toDataURL('image/jpeg', 0.96), 'JPEG', 0, 0, 210, 297, undefined, 'FAST');
                        const folder = kind === 'clearance' ? 'المخالصات' : kind === 'settlement' ? 'التسويات' : 'شهادات_الخبرة';
                        zip.file(`PDF/${folder}/${index + 1}_${record.emp_code}.pdf`, pdf.output('blob'));
                    }
                }
                for (let index = 0; index < employeeDocs.length; index += 1) {
                    const doc = employeeDocs[index];
                    const base64 = String(doc.file_data || '').split(',')[1];
                    if (base64) zip.file(`المرفقات_الأصلية/${index + 1}_${doc.document_type}_${doc.file_name || 'مستند'}`, base64, { base64: true });
                    const docPdf = await createEmployeeDocumentPdfBlob(doc, employee);
                    zip.file(`PDF/${index + 1}_${doc.document_type}.pdf`, docPdf);
                }
                const blob = await zip.generateAsync({ type: 'blob', compression: 'DEFLATE', compressionOptions: { level: 6 } });
                const url = URL.createObjectURL(blob);
                const anchor = document.createElement('a'); anchor.href = url; anchor.download = `ملف_الموظف_${safeName}_${employee.emp_code}.zip`; anchor.click();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
            };
            return <div className="space-y-6">
                <div className="bg-gradient-to-r from-slate-900 via-slate-800 to-emerald-950 rounded-2xl p-6 text-white shadow-xl border border-emerald-500/30"><h2 className="text-xl font-bold">مستندات الموظفين</h2><p className="text-slate-300 text-xs mt-1">ملف مستقل لكل موظف يضم الهوية أو الإقامة، السيرة الذاتية، المستندات الخاصة، والجزاءات والخصومات والتسويات.</p></div>
                <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5 space-y-4"><div className="grid grid-cols-1 md:grid-cols-4 gap-3 items-end"><div className="md:col-span-1"><label className="block text-xs font-bold mb-1">اختيار الموظف</label><select value={selectedEmpId} onChange={e => setSelectedEmpId(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-xs">{employees.map(e => <option key={e.id} value={e.id}>{e.emp_code} - {e.full_name}</option>)}</select></div><div><label className="block text-xs font-bold mb-1">نوع المستند</label><select value={documentType} onChange={e => setDocumentType(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-xs"><option>الهوية / الإقامة</option><option>السيرة الذاتية</option><option>رخصة العمل</option><option>التأمين الطبي</option><option>العقد</option><option>شهادة أو مؤهل</option><option>مستند آخر</option></select></div><div><label className="block text-xs font-bold mb-1">ملاحظات</label><input value={notes} onChange={e => setNotes(e.target.value)} className="w-full bg-slate-50 border rounded-xl p-2.5 text-xs" placeholder="وصف مختصر للمستند" /></div><div><label className="w-full flex items-center justify-center gap-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl p-2.5 text-xs font-bold cursor-pointer"><i data-lucide="upload" className="w-4 h-4"></i><span>رفع مستند</span><input type="file" accept=".pdf,.png,.jpg,.jpeg,.webp,.doc,.docx" onChange={handleFile} className="hidden" /></label></div></div></div>
                <div className="grid grid-cols-1 lg:grid-cols-3 gap-5"><div className="lg:col-span-2 bg-white rounded-2xl border border-slate-200 shadow-sm p-5"><div className="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-3 border-b pb-3 mb-4"><div><h3 className="font-bold text-slate-900">ملف {employee.full_name || 'الموظف'}</h3><span className="text-xs text-slate-500">{employeeDocs.length} ملفات مرفوعة + {employeeDiscipline.length} جزاءات + {employeeSettlements.length} تسويات</span></div><div className="flex items-center gap-2"><button onClick={handlePreviewAll} className="px-3 py-2 bg-slate-700 hover:bg-slate-800 text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i data-lucide="file-search" className="w-4 h-4"></i><span>معاينة PDF المجمعة</span></button><button onClick={handleDownloadAll} className="px-3 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold flex items-center gap-1.5"><i data-lucide="archive-download" className="w-4 h-4"></i><span>تنزيل ZIP</span></button></div></div>{employeeDocs.length === 0 ? <div className="py-12 text-center text-sm text-slate-400">لم يتم رفع مستندات لهذا الموظف بعد.</div> : <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">{employeeDocs.map(doc => <div key={doc.id} className="border rounded-xl p-3 bg-slate-50 flex items-start justify-between gap-3"><div className="min-w-0 flex-1"><div className="flex items-center gap-2"><div className="font-bold text-xs text-slate-800">{doc.document_type}</div><span className="text-[10px] px-1.5 py-0.5 rounded bg-blue-100 text-blue-800">{doc.file_type || 'ملف'}</span></div>{doc.file_type?.startsWith('image/') ? <a href={doc.file_data} target="_blank" rel="noreferrer" className="block mt-2"><img src={doc.file_data} alt={doc.file_name} className="h-24 w-full object-contain rounded-lg border bg-white" /></a> : <a href={doc.file_data} target="_blank" rel="noreferrer" className="flex items-center gap-2 mt-2 p-2 rounded-lg bg-white border text-blue-700 text-xs font-bold"><i data-lucide="file-text" className="w-4 h-4"></i><span>فتح المستند</span></a>}<div className="text-[11px] text-slate-600 truncate mt-1">{doc.file_name}</div><div className="text-[10px] text-slate-400 mt-1">{doc.uploaded_at}{doc.notes ? ` — ${doc.notes}` : ''}</div></div><div className="flex items-center gap-1 shrink-0"><button onClick={() => setPreviewDoc(doc)} className="p-1.5 rounded-lg bg-white text-slate-700 border" title="معاينة"><i data-lucide="eye" className="w-3.5 h-3.5"></i></button><a href={doc.file_data} download={doc.file_name} className="p-1.5 rounded-lg bg-white text-blue-700 border" title="تنزيل"><i data-lucide="download" className="w-3.5 h-3.5"></i></a><button onClick={() => onDeleteDocument(doc.id)} className="p-1.5 rounded-lg bg-white text-rose-700 border" title="حذف"><i data-lucide="trash-2" className="w-3.5 h-3.5"></i></button></div></div>)}</div>}</div><div className="space-y-5"><div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"><h3 className="font-bold text-slate-900 text-sm mb-3">الجزاءات والخصومات</h3>{employeeDiscipline.length === 0 ? <p className="text-xs text-slate-400">لا توجد قيود لهذا الموظف.</p> : employeeDiscipline.map(item => <div key={item.id} className="border-b py-2 text-xs"><div className="font-bold">{item.violation_type}</div><div className="text-slate-500">{item.violation_date} — خصم {Number(item.deduction_amount || 0).toLocaleString('ar-SA')} ر.س</div></div>)}</div><div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-5"><h3 className="font-bold text-slate-900 text-sm mb-3">التسويات والمستحقات</h3>{employeeSettlements.length === 0 ? <p className="text-xs text-slate-400">لا توجد تسويات لهذا الموظف.</p> : employeeSettlements.map(item => <div key={item.id} className="border-b py-2 text-xs"><div className="font-bold">{item.termination_date || 'تسوية'}</div><div className="text-slate-500">صافي المستحق: {Number(item.net_settlement || 0).toLocaleString('ar-SA')} ر.س</div></div>)}</div>                </div></div>{previewPdfUrl && <div className="fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-4"><div className="bg-white rounded-2xl shadow-2xl w-full max-w-4xl h-[90vh] p-4 flex flex-col gap-3"><div className="flex items-center justify-between"><h3 className="font-bold text-slate-900">معاينة PDF المجمعة</h3><button onClick={() => { URL.revokeObjectURL(previewPdfUrl); setPreviewPdfUrl(''); }} className="text-slate-500 text-xl">×</button></div><iframe title="معاينة PDF" src={previewPdfUrl} className="w-full flex-1 rounded-xl border"></iframe></div></div>}{previewDoc && <div className="fixed inset-0 z-50 bg-slate-900/70 flex items-center justify-center p-4"><div className="bg-white rounded-2xl shadow-2xl max-w-2xl w-full p-4 space-y-3"><div className="flex items-center justify-between"><h3 className="font-bold text-slate-900">معاينة {previewDoc.document_type}</h3><button onClick={() => setPreviewDoc(null)} className="text-slate-500 text-xl">×</button></div>{previewDoc.file_type?.startsWith('image/') ? <img src={previewDoc.file_data} alt={previewDoc.file_name} className="w-full max-h-[65vh] object-contain rounded-xl border" /> : <a href={previewDoc.file_data} target="_blank" rel="noreferrer" className="block p-8 text-center rounded-xl bg-slate-50 border text-blue-700 font-bold">فتح الملف الأصلي: {previewDoc.file_name}</a>}</div></div>}
            </div>;
        }

        function EmployeesView({ 
            employees, allEmployeesCount, searchTerm, setSearchTerm,

        }) {

        function AddSettlementModal({ employees, onClose, onSave }) {
            const [selectedEmpId, setSelectedEmpId] = useState('');
            const [termDate, setTermDate] = useState(new Date().toISOString().split('T')[0].replace(/-/g, '/'));
            const [reason, setReason] = useState('انتهاء مدة العقد المحدد وعدم الرغبة في التجديد (المادة 74)');
            const [daysWorked, setDaysWorked] = useState(30);
            const [leaveDays, setLeaveDays] = useState(0);
            const [years, setYears] = useState(3);
            const [months, setMonths] = useState(0);
            const [deductions, setDeductions] = useState(0);

            const selectedEmp = useMemo(() => employees.find(e => e.id === selectedEmpId), [employees, selectedEmpId]);

            const calculations = useMemo(() => {
                if (!selectedEmp) return { salaryDue: 0, leaveCash: 0, eosb: 0, net: 0 };
                const totalSalary = Number(selectedEmp.basic_salary) + Number(selectedEmp.housing_allowance) + Number(selectedEmp.transport_allowance);
                const daily = totalSalary / 30;
                const salaryDue = Math.round(daily * Number(daysWorked));
                const leaveCash = Math.round(daily * Number(leaveDays));

                const totYears = Number(years) + (Number(months) / 12);
                let eosb = 0;
                if (totYears <= 5) eosb = totYears * (totalSalary / 2);
                else eosb = (5 * (totalSalary / 2)) + ((totYears - 5) * totalSalary);

                if (reason.includes('استقالة')) {
                    if (totYears < 2) eosb = 0;
                    else if (totYears <= 5) eosb = eosb * (1/3);
                    else if (totYears < 10) eosb = eosb * (2/3);
                }

                eosb = Math.round(eosb);
                const net = Math.round(salaryDue + leaveCash + eosb - Number(deductions));
                return { salaryDue, leaveCash, eosb, net };
            }, [selectedEmp, daysWorked, leaveDays, years, months, reason, deductions]);

        function serviceDurationFromEmployee(employee) {
            const startValue = employee?.commencement_date || employee?.appointment_date || employee?.hire_date;
            const endValue = employee?.contract_end_date || new Date().toISOString().split('T')[0].replace(/-/g, '/');
            if (!startValue) return { years: 0, months: 0 };
            const start = new Date(String(startValue).replace(/\//g, '-'));
            const end = new Date(String(endValue).replace(/\//g, '-'));
            if (Number.isNaN(start.getTime()) || Number.isNaN(end.getTime()) || end <= start) return { years: 0, months: 0 };
            const totalMonths = Math.max(0, (end.getFullYear() - start.getFullYear()) * 12 + end.getMonth() - start.getMonth());
            return { years: Math.floor(totalMonths / 12), months: totalMonths % 12 };
        }

        function EOSBCalculatorView({ employees }) {
            const [selectedEmpId, setSelectedEmpId] = useState(employees[0]?.id || '');
            const employee = employees.find(e => e.id === selectedEmpId) || employees[0] || {};
            const [salary, setSalary] = useState(Number(employee.basic_salary || 0) + Number(employee.housing_allowance || 0));
            const initialDuration = serviceDurationFromEmployee(employee);
            const [years, setYears] = useState(initialDuration.years || 3);
            const [months, setMonths] = useState(initialDuration.months || 6);
            const [endReason, setEndReason] = useState('employer');
            useEffect(() => {
                const duration = serviceDurationFromEmployee(employee);
                setSalary(Number(employee.basic_salary || 0) + Number(employee.housing_allowance || 0));
                if (duration.years || duration.months) { setYears(duration.years); setMonths(duration.months); }
            }, [selectedEmpId]);
            const result = useMemo(() => {
                const totalYears = Math.max(0, Number(years) + (Number(months) / 12));
                const firstFive = Math.min(totalYears, 5) * (Number(salary) / 2);
                const afterFive = Math.max(totalYears - 5, 0) * Number(salary);
                const fullGratuity = firstFive + afterFive;
                let factor = 1;
                if (endReason === 'resignation') factor = totalYears < 2 ? 0 : totalYears <= 5 ? 1/3 : totalYears < 10 ? 2/3 : 1;
                return { totalYears, firstFive, afterFive, fullGratuity, finalAmount: fullGratuity * factor, factor };
            }, [salary, years, months, endReason]);
            return (
                <div className="space-y-6">
                    <div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200"><h2 className="text-lg font-bold text-slate-900">حاسبة مكافأة نهاية الخدمة</h2><p className="text-slate-500 text-xs mt-1">احسب المكافأة مع اختيار الموظف وأجر الحساب ومدة الخدمة ونوع انتهاء العلاقة.</p></div>
                    <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border space-y-4 text-xs">
                            <div className="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label className="block font-bold mb-1">الموظف</label><select value={selectedEmpId} onChange={e => setSelectedEmpId(e.target.value)} className="w-full border rounded-xl p-2.5"><option value="">إدخال يدوي</option>{employees.map(e => <option key={e.id} value={e.id}>{e.emp_code} - {e.full_name}</option>)}</select><div className="text-[10px] text-slate-500 mt-1">{employee.national_id || 'بدون هوية'} — مباشرة: {employee.commencement_date || employee.hire_date || 'غير محدد'} — عقد: {employee.contract_end_date || 'غير محدد'}</div></div><div><label className="block font-bold mb-1">أجر الحساب الشهري (ر.س)</label><input type="number" min="0" value={salary} onChange={e => setSalary(Number(e.target.value))} className="w-full border rounded-xl p-2.5 font-bold" /></div></div>
                            <div className="grid grid-cols-1 sm:grid-cols-3 gap-4"><div><label className="block font-bold mb-1">سنوات الخدمة</label><input type="number" min="0" value={years} onChange={e => setYears(Number(e.target.value))} className="w-full border rounded-xl p-2.5 font-mono" /></div><div><label className="block font-bold mb-1">الشهور</label><input type="number" min="0" max="11" value={months} onChange={e => setMonths(Number(e.target.value))} className="w-full border rounded-xl p-2.5 font-mono" /></div><div><label className="block font-bold mb-1">سبب الانتهاء</label><select value={endReason} onChange={e => setEndReason(e.target.value)} className="w-full border rounded-xl p-2.5"><option value="employer">إنهاء من صاحب العمل</option><option value="resignation">استقالة الموظف</option></select></div></div>
                            <div className="grid grid-cols-3 gap-3 pt-3 border-t"><div className="bg-slate-50 rounded-xl p-3"><span className="text-slate-500">أول 5 سنوات</span><strong className="block mt-1">{result.firstFive.toLocaleString('ar-SA')} ر.س</strong></div><div className="bg-slate-50 rounded-xl p-3"><span className="text-slate-500">ما بعد 5 سنوات</span><strong className="block mt-1">{result.afterFive.toLocaleString('ar-SA')} ر.س</strong></div><div className="bg-slate-50 rounded-xl p-3"><span className="text-slate-500">نسبة الاستحقاق</span><strong className="block mt-1">{Math.round(result.factor * 100)}%</strong></div></div>
                        </div>
                        <div className="bg-gradient-to-br from-emerald-900 to-slate-900 text-white rounded-2xl p-6 shadow-xl flex flex-col justify-between"><div><span className="text-xs font-semibold text-emerald-300">صافي مكافأة نهاية الخدمة</span><div className="text-3xl font-black mt-2 font-mono">{Math.round(result.finalAmount).toLocaleString('ar-SA')} <span className="text-base text-emerald-400">ر.س</span></div></div><div className="text-xs text-slate-300">{employee.full_name || 'إدخال يدوي'} — {result.totalYears.toFixed(2)} سنة خدمة</div></div>
                    </div>
                </div>
            );
        }

        function TerminationSettlementCalculator({ employees, onSave }) {
            const [selectedEmpId, setSelectedEmpId] = useState(employees[0]?.id || '');
            const employee = employees.find(e => e.id === selectedEmpId) || employees[0] || {};
            const initialDuration = serviceDurationFromEmployee(employee);
            const [serviceYears, setServiceYears] = useState(initialDuration.years || 3);
            const [serviceMonths, setServiceMonths] = useState(initialDuration.months || 6);
            const [unpaidDays, setUnpaidDays] = useState(0);
            const [leaveDays, setLeaveDays] = useState(0);
            const [deductions, setDeductions] = useState(0);
            const [advances, setAdvances] = useState(0);
            const [otherDue, setOtherDue] = useState(0);
            const [reason, setReason] = useState('انتهاء مدة العقد المحدد وعدم الرغبة في التجديد');
            const [termDate, setTermDate] = useState(new Date().toISOString().slice(0,10).replace(/-/g,'/'));
            useEffect(() => {
                const duration = serviceDurationFromEmployee(employee);
                if (duration.years || duration.months) { setServiceYears(duration.years); setServiceMonths(duration.months); }
                if (employee.contract_end_date) setTermDate(employee.contract_end_date);
            }, [selectedEmpId]);
            const salary = Number(employee.basic_salary || 0) + Number(employee.housing_allowance || 0) + Number(employee.transport_allowance || 0) + Number(employee.other_allowances || 0);
            const result = useMemo(() => {
                const years = Math.max(0, Number(serviceYears) + Number(serviceMonths) / 12);
                const firstFive = Math.min(years, 5) * (salary / 2);
                const afterFive = Math.max(years - 5, 0) * salary;
                const eosb = firstFive + afterFive;
                const salaryDue = salary / 30 * Number(unpaidDays || 0);
                const leaveCash = salary / 30 * Number(leaveDays || 0);
                const net = salaryDue + leaveCash + eosb + Number(otherDue || 0) - Number(deductions || 0) - Number(advances || 0);
                return { years, salaryDue, leaveCash, eosb, net };
            }, [salary, serviceYears, serviceMonths, unpaidDays, leaveDays, deductions, advances, otherDue]);
            const save = () => { onSave({ employee_id: employee.id, emp_code: employee.emp_code, employee_name: employee.full_name, department: employee.department, job_title: employee.job_title, hire_date: employee.hire_date, termination_date: termDate, reason, service_years: Number(serviceYears), service_months: Number(serviceMonths), salary_due: Math.round(result.salaryDue), leave_balance_cash: Math.round(result.leaveCash), eosb_amount: Math.round(result.eosb), deductions_due: Number(deductions), net_settlement: Math.round(result.net) }); alert('تم حفظ تسوية المستحقات في سجل إنهاء العقود.'); };
            const field = (label, value, setValue, type = 'number') => <div><label className="block font-bold mb-1">{label}</label><input type={type} min={type === 'number' ? 0 : undefined} value={value} onChange={e => setValue(type === 'number' ? Number(e.target.value) : e.target.value)} className="w-full border rounded-xl p-2.5 text-xs" /></div>;
            return <div className="space-y-6"><div className="bg-white rounded-2xl p-6 shadow-sm border border-slate-200"><h2 className="text-lg font-bold text-slate-900">حاسبة انتهاء العلاقة التعاقدية وتسليم المستحقات</h2><p className="text-slate-500 text-xs mt-1">احسب أجر الأيام، بدل رصيد الإجازات، مكافأة نهاية الخدمة، الخصومات والسلف ثم احفظ التسوية.</p></div><div className="grid grid-cols-1 lg:grid-cols-3 gap-6"><div className="lg:col-span-2 bg-white rounded-2xl p-6 shadow-sm border space-y-4 text-xs"><div className="grid grid-cols-1 sm:grid-cols-2 gap-4"><div><label className="block font-bold mb-1">الموظف</label><select value={selectedEmpId} onChange={e => setSelectedEmpId(e.target.value)} className="w-full border rounded-xl p-2.5"><option value="">اختر الموظف</option>{employees.map(e => <option key={e.id} value={e.id}>{e.emp_code} - {e.full_name}</option>)}</select><div className="text-[10px] text-slate-500 mt-1">الهوية: {employee.national_id || 'غير محدد'} — الراتب الإجمالي: {salary.toLocaleString('ar-SA')} ر.س — المباشرة: {employee.commencement_date || employee.hire_date || 'غير محدد'}</div></div>{field('تاريخ انتهاء العلاقة', termDate, setTermDate, 'text')}</div><div className="grid grid-cols-2 sm:grid-cols-4 gap-4">{field('سنوات الخدمة', serviceYears, setServiceYears)}{field('الشهور', serviceMonths, setServiceMonths)}{field('أيام راتب مستحقة', unpaidDays, setUnpaidDays)}{field('أيام إجازة مستحقة', leaveDays, setLeaveDays)}</div><div className="grid grid-cols-1 sm:grid-cols-3 gap-4">{field('خصومات', deductions, setDeductions)}{field('سلف وعهد مالية', advances, setAdvances)}{field('مستحقات أخرى', otherDue, setOtherDue)}</div><div><label className="block font-bold mb-1">سبب انتهاء العلاقة</label><input value={reason} onChange={e => setReason(e.target.value)} className="w-full border rounded-xl p-2.5 text-xs" /></div><button onClick={save} disabled={!employee.id} className="w-full sm:w-auto px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 disabled:bg-slate-300 text-white rounded-xl font-bold text-xs">حفظ التسوية وتسليم المستحقات</button></div><div className="bg-gradient-to-br from-amber-900 to-slate-900 text-white rounded-2xl p-6 shadow-xl"><span className="text-xs text-amber-300 font-semibold">ملخص التسوية</span><div className="space-y-3 mt-4 text-xs"><div className="flex justify-between"><span>أجر الأيام</span><strong>{Math.round(result.salaryDue).toLocaleString('ar-SA')} ر.س</strong></div><div className="flex justify-between"><span>بدل الإجازات</span><strong>{Math.round(result.leaveCash).toLocaleString('ar-SA')} ر.س</strong></div><div className="flex justify-between"><span>مكافأة نهاية الخدمة</span><strong>{Math.round(result.eosb).toLocaleString('ar-SA')} ر.س</strong></div><div className="flex justify-between border-t border-white/20 pt-3 text-base"><span>صافي المستحق</span><strong className="text-amber-300">{Math.round(result.net).toLocaleString('ar-SA')} ر.س</strong></div></div><p className="text-[10px] text-slate-300 mt-6">مدة الخدمة المحسوبة: {result.years.toFixed(2)} سنة. راجع اللائحة الداخلية والعقد قبل اعتماد الصرف.</p></div></div></div>;
        }
        // =====================================================================
        // LOCAL AUTH + COMPANY ONBOARDING GATE
        // =====================================================================
        function LocalAuthGate({ children }) {
            const [mode, setMode] = useState('loading');
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [displayName, setDisplayName] = useState('');
            const [error, setError] = useState('');
            const [user, setUser] = useState(null);
            const [settingsOpen, setSettingsOpen] = useState(false);
            const [officialLogo, setOfficialLogo] = useState(() => localStorage.getItem('hr_official_logo') || ALNESR_INFO.logoUrl);
            const [logoSaved, setLogoSaved] = useState(false);

            const api = async (url, options = {}) => {
                const response = await fetch(url, { credentials: 'include', headers: { 'Content-Type': 'application/json', ...(options.headers || {}) }, ...options });
                const body = await response.json().catch(() => ({}));
                if (!response.ok) throw new Error(body.error || 'تعذر تنفيذ العملية');
                return body;
            };
            useEffect(() => {
    let mounted = true;

    const loadSession = async () => {
        try {
            const {
                data: { session },
                error: sessionError
            } = await supabaseClient.auth.getSession();

            if (sessionError) {
                throw sessionError;
            }

            if (!session?.user) {
                if (mounted) {
                    setUser(null);
                    setMode('login');
                }
                return;
            }

            const { data: profile, error: profileError } =
                await supabaseClient
                    .from('profiles')
                    .select('*')
                    .eq('id', session.user.id)
                    .single();

            if (profileError) {
                throw profileError;
            }

            if (mounted) {
                setUser({
                    id: session.user.id,
                    username: session.user.email,
                    email: session.user.email,
                    displayName:
                        profile?.display_name ||
                        session.user.user_metadata?.display_name ||
                        session.user.email,
                    role: profile?.role || 'admin'
                });

                setMode('ready');
            }

        } catch (error) {
            console.error('Supabase session error:', error);

            if (mounted) {
                setUser(null);
                setMode('login');
                setError(error?.message || 'تعذر التحقق من جلسة الدخول');
            }
        }
    };

    loadSession();

    // متابعة تسجيل الدخول والخروج تلقائيًا
    const {
        data: { subscription }
    } = supabaseClient.auth.onAuthStateChange(
        async (event, session) => {

            if (!mounted) return;

            if (event === 'SIGNED_OUT' || !session?.user) {
                setUser(null);
                setMode('login');
                return;
            }

            if (
                event === 'SIGNED_IN' ||
                event === 'TOKEN_REFRESHED' ||
                event === 'INITIAL_SESSION'
            ) {
                try {
                    const { data: profile, error } =
                        await supabaseClient
                            .from('profiles')
                            .select('*')
                            .eq('id', session.user.id)
                            .single();

                    if (error) throw error;

                    setUser({
                        id: session.user.id,
                        username: session.user.email,
                        email: session.user.email,
                        displayName:
                            profile?.display_name ||
                            session.user.user_metadata?.display_name ||
                            session.user.email,
                        role: profile?.role || 'admin'
                    });

                    setMode('ready');

                } catch (error) {
                    console.error('Profile loading error:', error);
                    setUser(null);
                    setMode('login');
                    setError(error?.message || 'تعذر تحميل بيانات المستخدم');
                }
            }
        }
    );

    return () => {
        mounted = false;
        subscription.unsubscribe();
    };
}, []);
            const submitAuth = async (event) => {
    event.preventDefault();
    setError('');

    try {
        if (!username || !password) {
            setError('يرجى إدخال البريد الإلكتروني وكلمة المرور');
            return;
        }

        const { data, error } =
            await supabaseClient.auth.signInWithPassword({
                email: username.trim(),
                password: password
            });

        if (error) {
            throw error;
        }

        if (!data.user) {
            throw new Error('تعذر تسجيل الدخول');
        }

        // جلب بيانات المستخدم من profiles
        const { data: profile, error: profileError } =
            await supabaseClient
                .from('profiles')
                .select('*')
                .eq('id', data.user.id)
                .single();

        if (profileError) {
            throw profileError;
        }

        setUser({
            id: data.user.id,
            username: data.user.email,
            email: data.user.email,
            displayName:
                profile?.display_name ||
                data.user.user_metadata?.display_name ||
                data.user.email,
            role: profile?.role || 'admin'
        });

        setMode('ready');

    } catch (e) {
        console.error('Supabase login error:', e);

        setError(
            e?.message ||
            'البريد الإلكتروني أو كلمة المرور غير صحيحة'
        );
    }
};
            const readFile = (file, setter) => {
                if (!file) return;
                const reader = new FileReader(); reader.onload = () => setter(String(reader.result || '')); reader.readAsDataURL(file);
            };
            const saveOfficialLogo = () => {
                const value = officialLogo || '/assets/logo.png';
                localStorage.setItem('hr_official_logo', value);
                ALNESR_INFO.logoUrl = value;
                setLogoSaved(true);
                setTimeout(() => setLogoSaved(false), 1800);
            };
            const resetOfficialLogo = () => {
                localStorage.removeItem('hr_official_logo');
                ALNESR_INFO.logoUrl = '/assets/logo.png';
                setOfficialLogo('/assets/logo.png');
                setLogoSaved(true);
                setTimeout(() => setLogoSaved(false), 1800);
            };
            if (mode === 'loading') return <div className="min-h-screen flex items-center justify-center bg-slate-950 text-white"><div className="text-center"><div className="text-3xl font-black text-emerald-400">HR.NISR.SA</div><div className="mt-2 text-sm text-slate-300">جارٍ تجهيز جلسة الدخول الآمنة...</div></div></div>;
            if (mode === 'login' || mode === 'setup') return <div dir="rtl" className="min-h-screen flex items-center justify-center bg-slate-950 px-4"><div className="w-full max-w-md bg-white rounded-3xl shadow-2xl p-8"><div className="text-center mb-8"><div className="mx-auto w-20 h-20 rounded-2xl bg-slate-100 flex items-center justify-center overflow-hidden"><img src={ALNESR_INFO.logoUrl} className="max-w-full max-h-full object-contain" /></div><h1 className="text-2xl font-black text-slate-900 mt-4">HR.NISR.SA</h1><p className="text-slate-500 text-sm mt-1">نظام إدارة الموارد البشرية متعدد الشركات</p></div><h2 className="text-lg font-black text-slate-900 mb-4">{mode === 'setup' ? 'إنشاء حساب الإدارة الأول' : 'تسجيل الدخول'}</h2><form onSubmit={submitAuth} className="space-y-4"><div><label className="block text-xs font-bold text-slate-700 mb-1">اسم المستخدم</label><input required value={username} onChange={e => setUsername(e.target.value)} className="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm" autoComplete="username" /></div>{mode === 'setup' && <div><label className="block text-xs font-bold text-slate-700 mb-1">الاسم الظاهر</label><input required value={displayName} onChange={e => setDisplayName(e.target.value)} className="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm" /></div>}<div><label className="block text-xs font-bold text-slate-700 mb-1">كلمة المرور</label><input required minLength="8" type="password" value={password} onChange={e => setPassword(e.target.value)} className="w-full rounded-xl border border-slate-200 px-3 py-3 text-sm" autoComplete={mode === 'setup' ? 'new-password' : 'current-password'} /></div>{error && <div className="rounded-xl bg-rose-50 text-rose-700 text-xs font-bold p-3">{error}</div>}<button className="w-full rounded-xl bg-blue-900 hover:bg-blue-800 text-white font-bold py-3">{mode === 'setup' ? 'إنشاء الحساب والدخول' : 'دخول آمن'}</button></form></div></div>;
            return <><div dir="rtl" className="fixed top-3 left-3 z-[60] flex items-center gap-2"><button onClick={() => setSettingsOpen(true)} className="rounded-xl bg-slate-900 text-white px-3 py-2 text-xs font-bold shadow-lg">الإعدادات</button><button onClick={async () => { await api('/api/local-auth/logout', { method: 'POST' }); window.location.reload(); }} className="rounded-xl bg-rose-700 text-white px-3 py-2 text-xs font-bold shadow-lg">خروج</button></div>{children}{settingsOpen && <div dir="rtl" className="fixed inset-0 z-[70] bg-slate-950/70 flex items-center justify-center p-4"><div className="bg-white rounded-3xl shadow-2xl w-full max-w-lg p-6"><div className="flex items-center justify-between mb-5"><div><h2 className="text-xl font-black text-slate-900">الإعدادات</h2><p className="text-xs text-slate-500 mt-1">تخصيص الهوية الرسمية للنظام.</p></div><button onClick={() => setSettingsOpen(false)} className="text-slate-500 text-xl">×</button></div><div className="rounded-2xl border border-slate-200 p-4"><h3 className="font-black text-slate-900">الشعار الرسمي</h3><p className="text-xs text-slate-500 mt-1 mb-3">غيّر الشعار يدويًا عند الحاجة وسيُستخدم في الواجهة والنماذج وملفات PDF.</p><div className="flex items-center gap-4 mb-4"><div className="w-20 h-20 rounded-2xl bg-slate-100 flex items-center justify-center overflow-hidden"><img src={officialLogo} className="official-logo-hover max-w-full max-h-full object-contain" /></div><label className="flex-1 rounded-xl border border-dashed border-slate-300 p-3 text-xs font-bold cursor-pointer">اختيار شعار جديد<input type="file" accept="image/*" onChange={e => readFile(e.target.files?.[0], setOfficialLogo)} className="block w-full mt-2 text-xs" /></label></div><div className="flex items-center gap-2"><button onClick={saveOfficialLogo} className="rounded-xl bg-blue-900 text-white font-bold px-4 py-2.5 text-sm">حفظ الشعار</button><button onClick={resetOfficialLogo} className="rounded-xl bg-slate-100 text-slate-700 font-bold px-4 py-2.5 text-sm">استعادة الافتراضي</button>{logoSaved && <span className="text-emerald-700 text-xs font-bold">تم الحفظ</span>}</div></div></div></div>}</>;
        }

        // ROOT RENDER
        // =========================================================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<LocalAuthGate><App /></LocalAuthGate>);
    </script>
</body>
</html>
